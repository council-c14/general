<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
:root{
  --bg:#f5f5f2;--panel:#fff;--side:#eeeeea;
  --ink:#1b1b19;--ink-2:#3a3a36;--muted:#72726b;--faint:#a3a39b;
  --line:#e3e2dc;--line-2:#d3d2cb;
  --accent:#1f5c4a;--accent-ink:#174636;--accent-weak:#e6efea;
  --danger:#a5321e;--danger-weak:#f8e9e5;
  --warn:#8a5a00;--warn-weak:#f7eedb;
  --info:#28508a;--info-weak:#e8eef7;
  --radius:6px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Layout */
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.biz{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.biz-mark{width:28px;height:28px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.biz-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.biz-name{font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz-sub{font-size:11px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--ink-2);font-weight:500}
.nav a:hover{background:#e4e4df;text-decoration:none}
.nav a.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.8}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:14px 10px 4px}
.side-foot{margin-top:auto;padding:8px 10px;font-size:11px;color:var(--faint)}
main{padding:28px 36px 64px;min-width:0;max-width:1240px}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:22px}
.page-head .sub{color:var(--muted);margin-top:2px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:#fafaf8;border-color:#c4c3bb}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#33332f}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:#ebebe6}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--ink-2)}
.inp,label.f :is(input,select,textarea){height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;font-size:14px;font-weight:400;color:var(--ink);width:100%;min-width:0}
label.f textarea,textarea.inp{height:auto;padding:8px 10px;resize:vertical;min-height:72px}
.inp:focus,label.f :is(input,select,textarea):focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.span2{grid-column:span 2}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;padding:2px;gap:2px}
.seg button,.seg a{border:0;background:none;padding:4px 10px;border-radius:4px;font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:500;text-decoration:none!important}
.seg .on{background:var(--ink);color:#fff}

/* Cards and tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:14px}
.card-body{padding:18px}
.stack{display:grid;gap:18px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:18px}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi-label{font-size:12px;color:var(--muted)}
.kpi-value{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-note{font-size:12px;color:var(--muted);margin-top:2px}
.kpi-value.bad{color:var(--danger)}

table.t{width:100%;border-collapse:collapse}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);background:#fafaf8;white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.link{cursor:pointer}
.t tbody tr.link:hover td{background:#fafaf7}
.t tfoot td{font-weight:600;border-top:1px solid var(--line-2);background:#fafaf8}
.t .num{text-align:right}
.t th.num{text-align:right}
.t .strong{font-weight:500}
.tbl-wrap{overflow-x:auto}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .inp{width:240px;height:30px;font-size:13px}
.toolbar .grow{flex:1}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:#efefeb;color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.pill.sent{background:var(--info-weak);color:var(--info)}
.pill.partial,.pill.expired{background:var(--warn-weak);color:var(--warn)}
.pill.paid,.pill.accepted{background:var(--accent-weak);color:var(--accent-ink)}
.pill.overdue,.pill.declined{background:var(--danger-weak);color:var(--danger)}
.pill.invoiced{background:#ecebf5;color:#4a4580}
.pill.void{text-decoration:line-through;color:var(--faint)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none!important}
.tabs a.on{color:var(--ink);border-color:var(--ink)}
.tabs a .c{font-size:11px;background:#e9e9e4;border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--ink-2)}

/* Two-column pages */
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.sticky{position:sticky;top:20px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 0;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;padding-left:16px;text-align:right;font-variant-numeric:tabular-nums}
.dl .total{font-weight:600;font-size:15px;padding-top:8px;border-top:1px solid var(--line)}

/* Line item editor */
.items-edit{width:100%;border-collapse:collapse;margin-top:6px}
.items-edit th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.items-edit td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.items-edit .inp{height:32px}
.items-edit textarea.inp{min-height:32px;height:32px;padding:6px 10px;resize:none;overflow:hidden;line-height:1.35}
.items-edit .amt{padding-top:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.items-edit .q{width:84px}.items-edit .r{width:130px}.items-edit .a{width:120px}.items-edit .x{width:36px}
.items-edit input[type=number]{text-align:right}
.icon-x{width:30px;height:30px;border:0;background:none;border-radius:5px;color:var(--faint);cursor:pointer;margin-top:1px}
.icon-x:hover{background:var(--danger-weak);color:var(--danger)}

/* Menu */
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 10px 30px rgba(20,20,15,.12);padding:4px;min-width:190px;z-index:20}
.menu-list button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:5px;cursor:pointer}
.menu-list button:hover{background:#f1f1ed}
.menu-list .danger{color:var(--danger)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Dialog and toast */
dialog{border:0;border-radius:10px;padding:0;width:min(520px,calc(100% - 32px));box-shadow:0 24px 60px rgba(20,20,15,.25);color:var(--ink)}
dialog::backdrop{background:rgba(28,28,24,.35)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.dlg-body{padding:18px 20px;display:grid;gap:14px}
.dlg-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fafaf8;border-radius:0 0 10px 10px}
.err{color:var(--danger);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Document preview */
.paper-wrap{overflow:auto;padding:2px}
.paper{width:210mm;min-height:297mm;background:#fff;color:#1d1d1b;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(20,20,15,.08);border:1px solid var(--line);margin:0 auto;position:relative;font-size:10pt;line-height:1.45}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.thumb{height:400px;overflow:hidden;border-bottom:1px solid var(--line);background:#f0f0ec;padding:16px 0 0;border-radius:8px 8px 0 0}
.thumb .paper{zoom:.39;pointer-events:none;border:0}
.thumb-foot{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* Shared document parts */
.paper .doc-items{width:100%;border-collapse:collapse}
.paper .doc-items th{text-align:left;font-weight:600}
.paper .doc-items th.r{text-align:right}
.paper .doc-items td{vertical-align:top}
.paper .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .item-sub{color:#6b6b66;font-size:9pt;white-space:pre-line}
.paper .tot{margin-left:auto;width:78mm;border-collapse:collapse}
.paper .tot td{padding:4px 0}
.paper .pre{white-space:pre-line}
.paper .stamp{position:absolute;top:62mm;right:20mm;transform:rotate(-12deg);border:2.5px solid #2f7a55;color:#2f7a55;padding:4px 14px;font-weight:800;letter-spacing:.18em;font-size:20pt;border-radius:4px;opacity:.8}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:16mm}
.paper .sign div{border-top:1px solid #9a9a94;padding-top:4px;font-size:8.5pt;color:#6b6b66}
.paper .logo{max-height:18mm;max-width:50mm;display:block}

/* Template: Classic */
.tpl-classic{padding:18mm 18mm 26mm}
.tpl-classic .serif{font-family:Georgia,"Times New Roman",serif}
.tpl-classic .hd{display:flex;justify-content:space-between;gap:12mm;padding-bottom:7mm;border-bottom:2px solid #1d1d1b}
.tpl-classic .bname{font-family:Georgia,serif;font-size:17pt;margin:3mm 0 1.5mm}
.tpl-classic .from{color:#55554f;font-size:9pt}
.tpl-classic .title{text-align:right}
.tpl-classic .title h1{font-family:Georgia,serif;font-weight:400;font-size:24pt;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4mm}
.tpl-classic .meta{margin-left:auto;border-collapse:collapse;font-size:9pt}
.tpl-classic .meta th{text-align:left;color:#6b6b66;font-weight:400;padding:1px 6mm 1px 0}
.tpl-classic .meta td{text-align:right;padding:1px 0;font-weight:600}
.tpl-classic .parties{display:flex;justify-content:space-between;gap:12mm;margin:8mm 0}
.tpl-classic h4{font-size:8pt;text-transform:uppercase;letter-spacing:.12em;color:#6b6b66;font-weight:600;margin:0 0 2mm}
.tpl-classic .due b{display:block;font-family:Georgia,serif;font-size:18pt;font-weight:400;text-align:right}
.tpl-classic .due{text-align:right}
.tpl-classic .doc-items th{font-size:8pt;text-transform:uppercase;letter-spacing:.1em;padding:2.5mm 2mm;border-top:1px solid #1d1d1b;border-bottom:1px solid #1d1d1b}
.tpl-classic .doc-items td{padding:2.5mm 2mm;border-bottom:1px solid #dcdcd6}
.tpl-classic .tot{margin-top:5mm}
.tpl-classic .tot .grand td{border-top:2px solid #1d1d1b;padding-top:2mm;font-weight:700;font-size:11pt}
.tpl-classic .notes{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm;font-size:9pt}
.tpl-classic .foot{position:absolute;left:18mm;right:18mm;bottom:12mm;text-align:center;color:#8a8a84;font-size:8pt;border-top:1px solid #dcdcd6;padding-top:3mm}

/* Template: Modern */
.tpl-modern{padding:0 0 26mm}
.tpl-modern .band{background:var(--a);color:#fff;padding:12mm 16mm 10mm;display:flex;justify-content:space-between;align-items:flex-start;gap:10mm}
.tpl-modern .band .logo{background:#fff;padding:2mm;border-radius:2px;margin-bottom:3mm}
.tpl-modern .bname{font-size:15pt;font-weight:700;letter-spacing:-.01em}
.tpl-modern .band .from{opacity:.85;font-size:8.5pt;text-align:right}
.tpl-modern .title{padding:10mm 16mm 0;display:flex;justify-content:space-between;align-items:baseline}
.tpl-modern .title h1{font-size:26pt;font-weight:300;letter-spacing:-.02em;margin:0;color:var(--a)}
.tpl-modern .title .no{font-size:11pt;color:#55554f}
.tpl-modern .strip{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8mm;margin:7mm 16mm 9mm;padding:6mm 0;border-top:1px solid #e3e3de;border-bottom:1px solid #e3e3de}
.tpl-modern h4{font-size:7.5pt;text-transform:uppercase;letter-spacing:.1em;color:#8a8a84;font-weight:600;margin:0 0 1.5mm}
.tpl-modern .big{font-size:17pt;font-weight:700;color:var(--a);font-variant-numeric:tabular-nums}
.tpl-modern .body{padding:0 16mm}
.tpl-modern .doc-items th{background:color-mix(in srgb,var(--a) 9%,#fff);color:var(--a);font-size:8pt;text-transform:uppercase;letter-spacing:.06em;padding:2.5mm 3mm}
.tpl-modern .doc-items td{padding:3mm;border-bottom:1px solid #ececE7}
.tpl-modern .tot{margin-top:4mm}
.tpl-modern .tot td{padding:3px 3mm}
.tpl-modern .tot .grand td{background:var(--a);color:#fff;font-weight:700;font-size:11pt;padding:2.5mm 3mm}
.tpl-modern .notes{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm;font-size:9pt}
.tpl-modern .foot{position:absolute;left:16mm;right:16mm;bottom:12mm;display:flex;justify-content:space-between;color:#8a8a84;font-size:8pt}
.tpl-modern .stamp{top:50mm}

/* Template: Minimal */
.tpl-minimal{padding:20mm 20mm 26mm;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:9.5pt}
.tpl-minimal .hd{display:grid;grid-template-columns:1fr auto;gap:10mm;align-items:start}
.tpl-minimal .bname{font-weight:700;font-size:11pt}
.tpl-minimal h1{font-size:9.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0}
.tpl-minimal .amt{font-size:28pt;font-weight:300;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2mm}
.tpl-minimal .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm;margin:16mm 0 12mm;font-size:9pt}
.tpl-minimal h4{font-size:7.5pt;font-weight:400;color:#8a8a84;margin:0 0 1.5mm}
.tpl-minimal .doc-items th{font-weight:400;color:#8a8a84;font-size:8pt;padding:0 0 2.5mm;border-bottom:1px solid #1d1d1b}
.tpl-minimal .doc-items td{padding:2.5mm 0;border-bottom:1px solid #e8e8e3}
.tpl-minimal .doc-items td+td,.tpl-minimal .doc-items th+th{padding-left:4mm}
.tpl-minimal .tot{margin-top:4mm}
.tpl-minimal .tot .grand td{border-top:1px solid #1d1d1b;padding-top:2mm;font-weight:700}
.tpl-minimal .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;margin-top:14mm;font-size:8.5pt;color:#44443f}
.tpl-minimal .foot{position:absolute;left:20mm;right:20mm;bottom:12mm;color:#a3a39b;font-size:7.5pt;display:flex;justify-content:space-between}
.tpl-minimal .paid-note{color:#2f7a55;font-weight:700;text-align:right;letter-spacing:.1em;font-size:8pt;text-transform:uppercase}

/* Report paper */
.tpl-report{padding:16mm 16mm 22mm}
.tpl-report .hd{display:flex;justify-content:space-between;gap:10mm;border-bottom:2px solid #1d1d1b;padding-bottom:5mm;margin-bottom:6mm}
.tpl-report .bname{font-size:13pt;font-weight:700}
.tpl-report h1{font-size:16pt;margin:0;text-align:right;font-weight:600}
.tpl-report h3{font-size:9pt;text-transform:uppercase;letter-spacing:.08em;margin:7mm 0 2mm;color:#55554f}
.tpl-report .boxes{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #dcdcd6;margin:5mm 0}
.tpl-report .boxes div{padding:3mm;border-left:1px solid #dcdcd6}
.tpl-report .boxes div:first-child{border-left:0}
.tpl-report .boxes b{display:block;font-size:11.5pt;font-variant-numeric:tabular-nums}
.tpl-report .boxes span{font-size:8pt;color:#6b6b66}
.tpl-report table.rt{width:100%;border-collapse:collapse;font-size:9pt}
.tpl-report .rt th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#55554f;border-bottom:1px solid #1d1d1b;padding:1.8mm 1.5mm}
.tpl-report .rt td{padding:1.8mm 1.5mm;border-bottom:1px solid #e6e6e1}
.tpl-report .rt th.r{text-align:right}
.tpl-report .rt tfoot td{font-weight:700;border-top:1px solid #1d1d1b;border-bottom:0}

#print{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  #app,#toast,dialog{display:none!important}
  #print{display:block}
  #print .paper{box-shadow:none;border:0;margin:0;min-height:296mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .sticky{position:static}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr;align-content:start}
  .t td{white-space:nowrap}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  .biz{padding:0 8px 0 0}.biz-sub,.nav-label,.side-foot,.biz-name{display:none}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap}
  main{padding:20px 16px 48px}
  .kpis,.grid4{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2,.grid3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .paper-wrap .paper{zoom:.45}
  .toolbar .inp{width:100%}
}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="biz"><div class="biz-mark" id="biz-mark"></div><div style="min-width:0"><div class="biz-name" id="biz-name"></div><div class="biz-sub">Billing</div></div></div>
    <nav class="nav" id="nav">
      <a href="#/" data-nav=""><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Overview</a>
      <a href="#/invoices" data-nav="invoices doc-invoice"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/></svg>Invoices</a>
      <a href="#/quotes" data-nav="quotes doc-quote"><svg viewBox="0 0 24 24"><path d="M6 2h12v20H6z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>Quotations</a>
      <a href="#/customers" data-nav="customers customer"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 8M22 21c0-3-1.5-5-4-5.6"/></svg>Customers</a>
      <a href="#/reports" data-nav="reports report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
      <div class="nav-label">Setup</div>
      <a href="#/templates" data-nav="templates"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Templates</a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Business settings</a>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div id="print"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const sum = (list, f) => r2(list.reduce((s, x) => s + (+f(x) || 0), 0));
const uid = () => crypto.randomUUID();
const today = () => new Date().toLocaleDateString('en-CA');
const ymd = (y, m, d) => new Date(y, m, d).toLocaleDateString('en-CA');
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + (+n || 0)); return d.toLocaleDateString('en-CA'); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmtDate = iso => iso ? new Date(iso + 'T00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
function money(n, cur = S().currency) {
  try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: cur || 'USD' }).format(n || 0); }
  catch { return `${cur} ${(+n || 0).toFixed(2)}`; }
}
const plain = n => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let db = { customers: [], docs: [], settings: {} };
const DEFAULTS = {
  name: 'Your Business', address: '', phone: '', email: '', website: '', taxId: '',
  currency: 'MVR', taxLabel: 'GST', taxRate: 8, invoicePrefix: 'INV-', quotePrefix: 'QT-',
  dueDays: 30, validDays: 14, invoiceTemplate: 'classic', quoteTemplate: 'modern', accent: '#1f5c4a',
  logo: '', notes: 'Thank you for your business.', terms: '', bank: '',
};
const S = () => ({ ...DEFAULTS, ...db.settings });
const TEMPLATES = { classic: 'Classic', modern: 'Modern', minimal: 'Minimal' };
const TEMPLATE_NOTES = {
  classic: 'Serif letterhead with ruled tables. Suits professional services and formal tenders.',
  modern: 'Colour band in your brand accent with a clear amount-due strip.',
  minimal: 'Swiss-style grid, monochrome, the amount set large at the top.',
};
const METHODS = ['Bank transfer', 'Cash', 'Card', 'Cheque', 'Other'];
const cust = id => db.customers.find(c => c.id === id) || { name: 'Unknown customer' };
const docLabel = t => t === 'quote' ? 'Quotation' : 'Invoice';

/* ---------- server ---------- */
async function api(path = '', opts = {}) {
  const res = await fetch(`/api/billing${path ? '/' + path : ''}`, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
// Every write goes through here so the screen and the server can't drift silently.
async function persist(kind, rec) {
  try { await api(`${kind}/${rec.id}`, { method: 'PUT', body: rec }); return true; }
  catch { toast('Could not save. Check your connection and try again.'); return false; }
}
async function destroy(kind, id) {
  try { await api(`${kind}/${id}`, { method: 'DELETE' }); return true; }
  catch { toast('Could not delete. Check your connection and try again.'); return false; }
}
function upsert(list, rec) { const i = list.findIndex(x => x.id === rec.id); i < 0 ? list.push(rec) : (list[i] = rec); }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- money and status ---------- */
function totals(d) {
  const sub = sum(d.items || [], i => r2(i.qty * i.rate));
  const disc = r2(sub * (+d.discount || 0) / 100);
  const tax = r2((sub - disc) * (+d.taxRate || 0) / 100);
  const total = r2(sub - disc + tax);
  const paid = sum(d.payments || [], p => p.amount);
  return { sub, disc, tax, total, paid, balance: r2(total - paid) };
}
// Stored status is draft/sent/void (+ accepted/declined/invoiced for quotes); the rest is derived.
function status(d) {
  if (d.status === 'void') return 'void';
  if (d.type === 'quote') {
    if (d.status === 'sent' && d.due && d.due < today()) return 'expired';
    return d.status;
  }
  if (d.status === 'draft') return 'draft';
  const t = totals(d);
  if (t.total > 0 && t.balance <= 0) return 'paid';
  if (d.due && d.due < today()) return 'overdue';
  return t.paid > 0 ? 'partial' : 'sent';
}
const STATUS_LABEL = { draft: 'Draft', sent: 'Sent', partial: 'Part paid', paid: 'Paid', overdue: 'Overdue', void: 'Void', accepted: 'Accepted', declined: 'Declined', expired: 'Expired', invoiced: 'Invoiced' };
const pill = d => { const s = status(d); return `<span class="pill ${s}">${STATUS_LABEL[s]}</span>`; };
const isOpen = d => d.type === 'invoice' && ['sent', 'partial', 'overdue'].includes(status(d));
const isBilled = d => d.type === 'invoice' && !['draft', 'void'].includes(d.status);

// ponytail: next number is max+1 on this device; two people creating at the same second can collide (Save warns).
function nextNumber(type) {
  const prefix = type === 'quote' ? S().quotePrefix : S().invoicePrefix;
  const max = db.docs.filter(d => d.type === type && String(d.number).startsWith(prefix))
    .reduce((m, d) => Math.max(m, +(String(d.number).slice(prefix.length).match(/\d+$/) || [0])[0]), 0);
  return prefix + String(max + 1).padStart(4, '0');
}
const payments = () => db.docs.filter(isBilled).flatMap(d => (d.payments || []).map(p => ({ ...p, doc: d })));

function ledger(cid) {
  const rows = [];
  for (const d of db.docs) {
    if (d.customerId !== cid || !isBilled(d)) continue;
    rows.push({ date: d.date, kind: 'Invoice', ref: d.number, doc: d, debit: totals(d).total, credit: 0 });
    for (const p of d.payments || []) rows.push({ date: p.date, kind: 'Payment', ref: `${p.method}${p.ref ? ' · ' + p.ref : ''} — ${d.number}`, doc: d, debit: 0, credit: r2(p.amount) });
  }
  return rows.sort((a, b) => a.date.localeCompare(b.date) || b.debit - a.debit);
}
function statement(cid, from, to) {
  let opening = 0; const rows = [];
  for (const x of ledger(cid)) {
    if (from && x.date < from) opening = r2(opening + x.debit - x.credit);
    else if (!to || x.date <= to) rows.push(x);
  }
  let bal = opening;
  for (const x of rows) x.balance = bal = r2(bal + x.debit - x.credit);
  return { opening, rows, closing: bal, debit: sum(rows, x => x.debit), credit: sum(rows, x => x.credit) };
}
const BUCKETS = ['Current', '1–30 days', '31–60 days', '61–90 days', '90+ days'];
function aging(docs) {
  const b = [0, 0, 0, 0, 0];
  for (const d of docs.filter(isOpen)) {
    const late = daysBetween(d.due || d.date, today());
    const i = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    b[i] = r2(b[i] + totals(d).balance);
  }
  return b;
}

/* ---------- document templates ---------- */
function itemsTable(d, cols = ['#', 'Description', 'Qty', 'Rate', 'Amount']) {
  return `<table class="doc-items"><thead><tr>
    <th style="width:7mm">${cols[0]}</th><th>${cols[1]}</th><th class="r" style="width:16mm">${cols[2]}</th><th class="r" style="width:28mm">${cols[3]}</th><th class="r" style="width:30mm">${cols[4]}</th>
  </tr></thead><tbody>${(d.items || []).map((it, i) => {
    const [first, ...rest] = String(it.desc || '').split('\n');
    return `<tr><td>${i + 1}</td><td>${esc(first)}${rest.length ? `<div class="item-sub">${esc(rest.join('\n'))}</div>` : ''}</td>
      <td class="r">${+it.qty || 0}</td><td class="r">${plain(it.rate)}</td><td class="r">${plain(r2(it.qty * it.rate))}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function totalsTable(d) {
  const t = totals(d), s = S(), q = d.type === 'quote';
  const showPaid = !q && t.paid > 0;
  return `<table class="tot">
    <tr><td>Subtotal</td><td class="r">${plain(t.sub)}</td></tr>
    ${t.disc ? `<tr><td>Discount (${+d.discount}%)</td><td class="r">−${plain(t.disc)}</td></tr>` : ''}
    ${+d.taxRate ? `<tr><td>${esc(s.taxLabel)} (${+d.taxRate}%)</td><td class="r">${plain(t.tax)}</td></tr>` : ''}
    <tr class="${showPaid ? '' : 'grand'}"><td>Total (${esc(s.currency)})</td><td class="r">${money(t.total)}</td></tr>
    ${showPaid ? `<tr><td>Paid</td><td class="r">−${plain(t.paid)}</td></tr><tr class="grand"><td>Balance due</td><td class="r">${money(t.balance)}</td></tr>` : ''}
  </table>`;
}
function notesBlock(d, wrap = true) {
  const s = S(), parts = [];
  if (d.notes) parts.push(`<div><h4>Notes</h4><div class="pre">${esc(d.notes)}</div></div>`);
  if (d.type === 'invoice' && s.bank) parts.push(`<div><h4>Payment details</h4><div class="pre">${esc(s.bank)}</div></div>`);
  if (d.terms) parts.push(`<div><h4>Terms</h4><div class="pre">${esc(d.terms)}</div></div>`);
  return parts.length ? `<div class="notes">${parts.join('')}</div>` : '';
}
const contactLine = (x, sep = ' · ') => [x.phone, x.email].filter(Boolean).map(esc).join(sep);
function billTo(c) {
  return `<strong>${esc(c.name)}</strong>${c.contact ? `<br>Attn: ${esc(c.contact)}` : ''}${c.address ? `<br>${br(c.address)}` : ''}
    ${contactLine(c) ? `<br>${contactLine(c)}` : ''}${c.taxId ? `<br>TIN ${esc(c.taxId)}` : ''}`;
}
const logoImg = s => s.logo ? `<img class="logo" src="${esc(s.logo)}" alt="">` : '';
const signBlock = d => d.type === 'quote' ? `<div class="sign"><div>Accepted by (name &amp; signature)</div><div>Date</div></div>` : '';
const stamp = d => d.type === 'invoice' && status(d) === 'paid' ? '<div class="stamp">PAID</div>' : '';

function renderDoc(d, tpl = d.template, c = cust(d.customerId)) {
  const s = S(), t = totals(d), q = d.type === 'quote', title = docLabel(d.type);
  const dueLabel = q ? 'Valid until' : 'Due date';
  const amountLabel = q ? 'Quoted total' : t.paid > 0 ? 'Balance due' : 'Amount due';
  const amount = q ? t.total : t.balance;
  const fromLines = `${s.address ? br(s.address) + '<br>' : ''}${contactLine(s)}${s.taxId ? `<br>TIN ${esc(s.taxId)}` : ''}`;
  const style = `--a:${esc(s.accent)}`;

  if (tpl === 'modern') return `<div class="paper tpl-modern" style="${style}">
    <div class="band"><div>${logoImg(s)}<div class="bname">${esc(s.name)}</div></div><div class="from">${fromLines}</div></div>
    <div class="title"><h1>${title}</h1><div class="no">No. <strong>${esc(d.number)}</strong></div></div>
    <div class="strip">
      <div><h4>${q ? 'Prepared for' : 'Billed to'}</h4>${billTo(c)}</div>
      <div><h4>Issue date</h4>${fmtDate(d.date)}<h4 style="margin-top:3mm">${dueLabel}</h4>${fmtDate(d.due)}${d.ref ? `<h4 style="margin-top:3mm">Reference</h4>${esc(d.ref)}` : ''}</div>
      <div><h4>${amountLabel}</h4><div class="big">${money(amount)}</div></div>
    </div>
    <div class="body">${itemsTable(d)}${totalsTable(d)}${notesBlock(d)}${signBlock(d)}</div>
    ${stamp(d)}
    <div class="foot"><span>${esc(s.name)}</span><span>${esc(s.website)}</span><span>${esc(d.number)}</span></div>
  </div>`;

  if (tpl === 'minimal') return `<div class="paper tpl-minimal">
    <div class="hd">
      <div>${logoImg(s)}<div class="bname" style="margin-top:${s.logo ? '3mm' : 0}">${esc(s.name)}</div><div style="color:#6b6b66;margin-top:1mm">${fromLines}</div></div>
      <div><h1 style="text-align:right">${title}</h1><div class="amt">${money(amount)}</div><div style="text-align:right;color:#8a8a84;font-size:8pt">${amountLabel}</div>
        ${!q && status(d) === 'paid' ? '<div class="paid-note">Paid in full</div>' : ''}</div>
    </div>
    <div class="grid">
      <div><h4>${q ? 'For' : 'Billed to'}</h4>${billTo(c)}</div>
      <div><h4>Number</h4>${esc(d.number)}${d.ref ? `<h4 style="margin-top:3mm">Reference</h4>${esc(d.ref)}` : ''}</div>
      <div><h4>Issued</h4>${fmtDate(d.date)}</div>
      <div><h4>${dueLabel}</h4>${fmtDate(d.due)}</div>
    </div>
    ${itemsTable(d, ['', 'Description', 'Qty', 'Unit price', 'Amount'])}${totalsTable(d)}${notesBlock(d)}${signBlock(d)}
    <div class="foot"><span>${esc(s.name)}${s.website ? ' — ' + esc(s.website) : ''}</span><span>${esc(d.number)}</span></div>
  </div>`;

  return `<div class="paper tpl-classic">
    <div class="hd">
      <div>${logoImg(s)}<div class="bname">${esc(s.name)}</div><div class="from">${fromLines}</div></div>
      <div class="title"><h1>${title}</h1><table class="meta">
        <tr><th>${title} no.</th><td>${esc(d.number)}</td></tr>
        <tr><th>Date</th><td>${fmtDate(d.date)}</td></tr>
        <tr><th>${dueLabel}</th><td>${fmtDate(d.due)}</td></tr>
        ${d.ref ? `<tr><th>Reference</th><td>${esc(d.ref)}</td></tr>` : ''}
      </table></div>
    </div>
    <div class="parties"><div><h4>${q ? 'Quotation for' : 'Bill to'}</h4>${billTo(c)}</div>
      <div class="due"><h4>${amountLabel}</h4><b>${money(amount)}</b>${q ? '' : `<span style="color:#6b6b66;font-size:9pt">by ${fmtDate(d.due)}</span>`}</div></div>
    ${itemsTable(d)}${totalsTable(d)}${notesBlock(d)}${signBlock(d)}
    ${stamp(d)}
    <div class="foot">${[s.name, s.phone, s.email, s.website].filter(Boolean).map(esc).join('  ·  ')}</div>
  </div>`;
}

function printPaper(html, title) {
  $('#print').innerHTML = html;
  const old = document.title;
  document.title = title; // becomes the PDF file name in most browsers
  window.print();
  document.title = old;
}

/* ---------- dialogs ---------- */
function modal(title, body, { ok = 'Save', danger = false, onSubmit } = {}) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form novalidate><div class="dlg-head">${title}</div><div class="dlg-body">${body}<div class="err" hidden></div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary${danger ? ' danger-bg' : ''}" ${danger ? 'style="background:var(--danger);border-color:var(--danger)"' : ''}>${ok}</button></div></form>`;
  const form = $('form', dlg);
  $('[data-close]', dlg).onclick = () => dlg.close();
  form.onsubmit = async e => {
    e.preventDefault();
    const msg = await onSubmit?.(Object.fromEntries(new FormData(form)), form);
    if (typeof msg === 'string') { const el = $('.err', dlg); el.textContent = msg; el.hidden = false; return; }
    dlg.close();
  };
  dlg.showModal();
  $('input,select,textarea', form)?.focus();
}
const confirmBox = (title, text, ok = 'Delete') => new Promise(res => {
  modal(title, `<p style="margin:0;color:var(--ink-2)">${text}</p>`, { ok, danger: true, onSubmit: () => res(true) });
  $('#dlg').addEventListener('close', () => res(false), { once: true });
});

function customerDialog(c = {}, done) {
  const v = k => esc(c[k] || '');
  modal(c.id ? 'Edit customer' : 'New customer', `
    <label class="f">Customer or company name<input name="name" value="${v('name')}" required maxlength="160"></label>
    <div class="grid2"><label class="f">Contact person<input name="contact" value="${v('contact')}"></label>
      <label class="f">Tax ID (TIN)<input name="taxId" value="${v('taxId')}"></label></div>
    <div class="grid2"><label class="f">Email<input name="email" type="email" value="${v('email')}"></label>
      <label class="f">Phone<input name="phone" value="${v('phone')}"></label></div>
    <label class="f">Billing address<textarea name="address" rows="3">${v('address')}</textarea></label>
    <label class="f">Internal notes <span class="hint">Not printed on documents</span><textarea name="notes" rows="2">${v('notes')}</textarea></label>`, {
    ok: c.id ? 'Save changes' : 'Add customer',
    onSubmit: async (f, form) => {
      f.name = f.name.trim();
      if (!f.name) return 'Enter the customer name.';
      if (f.email && !form.email.checkValidity()) return 'That email address doesn’t look right.';
      const rec = { ...c, ...f, id: c.id || uid(), createdAt: c.createdAt || new Date().toISOString() };
      if (!await persist('customer', rec)) return 'Could not save. Try again.';
      upsert(db.customers, rec);
      done?.(rec);
    },
  });
}

function paymentDialog(d) {
  const t = totals(d);
  modal(`Record payment · ${esc(d.number)}`, `
    <div class="muted">Balance due <strong style="color:var(--ink)">${money(t.balance)}</strong></div>
    <div class="grid2"><label class="f">Amount<input name="amount" type="number" step="0.01" min="0.01" value="${plain(t.balance)}" required></label>
      <label class="f">Date received<input name="date" type="date" value="${today()}" required></label></div>
    <div class="grid2"><label class="f">Method<select name="method">${METHODS.map(m => `<option>${m}</option>`).join('')}</select></label>
      <label class="f">Reference <span class="hint">Transfer ID, cheque no.</span><input name="ref"></label></div>`, {
    ok: 'Record payment',
    onSubmit: async f => {
      const amount = r2(f.amount);
      if (!(amount > 0)) return 'Enter an amount greater than zero.';
      if (amount > t.balance) return `That is more than the balance due (${money(t.balance)}).`;
      if (!f.date) return 'Pick the date the payment was received.';
      const rec = { ...d, status: d.status === 'draft' ? 'sent' : d.status, payments: [...(d.payments || []), { id: uid(), amount, date: f.date, method: f.method, ref: f.ref.trim() }] };
      if (!await persist('doc', rec)) return 'Could not save. Try again.';
      upsert(db.docs, rec);
      toast(totals(rec).balance <= 0 ? `${d.number} is now paid in full` : 'Payment recorded');
      route();
    },
  });
}

/* ---------- page parts ---------- */
const head = (title, sub = '', actions = '', crumb = '') =>
  `<div class="page-head"><div>${crumb ? `<div class="crumb">${crumb}</div>` : ''}<h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="actions">${actions}</div></div>`;
const kpi = (label, value, note = '', bad = false) =>
  `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value${bad ? ' bad' : ''}">${value}</div>${note ? `<div class="kpi-note">${note}</div>` : ''}</div>`;
const ICON = {
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  print: '<svg viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>',

function docTable(list, type, opts = {}) {

const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || String(b.number).localeCompare(String(a.number));

function downloadCSV(name, rows) {
  const cell = v => {
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(v)) v = "'" + v; // stop spreadsheets running cell text as a formula
    v = String(v ?? '');
    return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function saveDoc() {
  const d = draft;

  const problem = !d.customerId ? 'Choose a customer.'
    : !d.number ? `Enter a ${docLabel(d.type).toLowerCase()} number.`
    : db.docs.some(x => x.type === d.type && x.id !== d.id && x.number === d.number) ? `${d.number} is already used by another ${docLabel(d.type).toLowerCase()}.`
    : !items.length ? 'Add at least one line item.'
    : !d.date ? 'Set the issue date.'
    : d.due && d.due < d.date ? `The ${d.type === 'quote' ? 'valid-until' : 'due'} date is before the issue date.`
    : null;
  if (problem) return toast(problem);
  const isNew = !db.docs.some(x => x.id === d.id);
  const now = new Date().toISOString();
  const rec = { ...d, items, createdAt: d.createdAt || now, updatedAt: now };
  if (!await persist('doc', rec)) return;
  upsert(db.docs, rec);
  if (isNew && rec.quoteId) {
    const q = db.docs.find(x => x.id === rec.quoteId);
    if (q) { const qr = { ...q, status: 'invoiced', invoiceId: rec.id, updatedAt: now }; if (await persist('doc', qr)) upsert(db.docs, qr); }
  }
  dirty = false;
  toast(`${rec.number} saved`);
  location.hash = `#/doc/${rec.id}`;
}

async function docAction(act, v) {
  const d = vDoc.current;
  const save = async patch => {
    const rec = { ...d, ...patch, updatedAt: new Date().toISOString() };
    if (!await persist('doc', rec)) return;
    upsert(db.docs, rec); route();
  };
  if (act === 'tpl') return save({ template: v });
  if (act === 'print') return printPaper(renderDoc(d), `${d.number} - ${cust(d.customerId).name}`);
  if (act === 'edit') return (location.hash = `#/edit/${d.id}`);
  if (act === 'pay') return paymentDialog(d);
  if (act === 'set-status') {
    if (v === 'void' && !await confirmBox(`Void ${esc(d.number)}?`, 'It stays on record for your audit trail but no longer counts as money owed.', 'Void invoice')) return;
    const patch = { status: v };
    if (v === 'draft' && d.type === 'quote') patch.invoiceId = undefined;
    toast(`${d.number} marked ${STATUS_LABEL[v].toLowerCase()}`);
    return save(patch);
  }
  if (act === 'convert') {
    if (d.invoiceId && db.docs.some(x => x.id === d.invoiceId)) return (location.hash = `#/doc/${d.invoiceId}`);
    const inv = freshDoc('invoice', d.customerId);
    pendingDoc = { ...inv, items: structuredClone(d.items), discount: d.discount, taxRate: d.taxRate, ref: d.ref || d.number, quoteId: d.id, notes: d.notes };
    return (location.hash = '#/new/invoice');
  }
  if (act === 'duplicate') {
    pendingDoc = { ...freshDoc(d.type, d.customerId), items: structuredClone(d.items), discount: d.discount, taxRate: d.taxRate, notes: d.notes, terms: d.terms, template: d.template };
    return (location.hash = `#/new/${d.type}`);
  }
  if (act === 'del-pay') {
    const p = d.payments.find(x => x.id === v);
    if (!await confirmBox('Remove this payment?', `${money(p.amount)} received ${fmtDate(p.date)} will be removed and the balance goes back up.`, 'Remove')) return;
    return save({ payments: d.payments.filter(x => x.id !== v) });
  }
  if (act === 'delete-doc') {
    const why = d.payments?.length ? ' It has payments recorded; consider voiding instead so your records stay complete.' : '';
    if (!await confirmBox(`Delete ${esc(d.number)}?`, `This permanently removes the ${docLabel(d.type).toLowerCase()}.${why}`)) return;
    if (!await destroy('doc', d.id)) return;
    db.docs = db.docs.filter(x => x.id !== d.id);
    toast(`${d.number} deleted`);
    location.hash = d.type === 'quote' ? '#/quotes' : '#/invoices';
  }
}

const PRESETS = { month: 'This month', 'last-month': 'Last month', quarter: 'This quarter', year: 'This year', 'last-year': 'Last year', all: 'All time', custom: 'Custom range' };
function presetRange(p) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if (p === 'month') return [ymd(y, m, 1), ymd(y, m + 1, 0)];
  if (p === 'last-month') return [ymd(y, m - 1, 1), ymd(y, m, 0)];
  if (p === 'quarter') { const q = m - m % 3; return [ymd(y, q, 1), ymd(y, q + 3, 0)]; }
  if (p === 'year') return [ymd(y, 0, 1), ymd(y, 11, 31)];
  if (p === 'last-year') return [ymd(y - 1, 0, 1), ymd(y - 1, 11, 31)];
  return ['', ''];
}
if (!period.from) [period.from, period.to] = presetRange(period.preset);
const inRange = date => (!period.from || date >= period.from) && (!period.to || date <= period.to);
const rangeText = () => period.from || period.to ? `${fmtDate(period.from) === '—' ? 'Start' : fmtDate(period.from)} – ${fmtDate(period.to) === '—' ? 'today' : fmtDate(period.to)}` : 'All time';

    <div class="thumbs">${Object.entries(TEMPLATES).map(([k, v]) => `<div class="card">
      <div class="thumb">${renderDoc(sampleDoc(tplType), k, SAMPLE_CUSTOMER)}</div>
      <div class="thumb-foot"><div><div class="strong">${v} ${s[key] === k ? '<span class="pill paid" style="margin-left:4px">Default</span>' : ''}</div><div class="muted small" style="max-width:260px">${TEMPLATE_NOTES[k]}</div></div>
        <div class="actions"><button class="btn sm" data-act="tpl-preview" data-v="${k}">Preview</button>${s[key] === k ? '' : `<button class="btn sm primary" data-act="tpl-default" data-v="${k}">Use as default</button>`}</div></div>
    </div>`).join('')}</div>
    <p class="muted small" style="margin-top:18px">Each document can switch template from its own page. The default applies to new ${tplType === 'quote' ? 'quotations' : 'invoices'}.</p>`;
}

/* Settings */
function vSettings() {
  const s = S(), v = k => esc(s[k]);
  main().innerHTML = head('Business settings', 'These details print on every quotation, invoice and statement.', `<button class="btn primary" data-act="save-settings">Save settings</button>`) + `
    <form id="settings" class="stack" onsubmit="return false">
      <div class="card"><div class="card-head"><h2>Business</h2></div><div class="card-body grid2">
        <label class="f">Business name<input name="name" value="${v('name')}" required></label>
        <label class="f">Tax ID (TIN)<input name="taxId" value="${v('taxId')}"></label>
        <label class="f">Email<input name="email" type="email" value="${v('email')}"></label>
        <label class="f">Phone<input name="phone" value="${v('phone')}"></label>
        <label class="f">Website<input name="website" value="${v('website')}"></label>
        <label class="f">Accent colour <span class="hint">Used by the Modern template</span><input name="accent" type="color" value="${v('accent')}" style="padding:2px 4px"></label>
        <label class="f">Address<textarea name="address" rows="3">${v('address')}</textarea></label>
        <div class="f"><span style="font-size:12px;font-weight:500;color:var(--ink-2)">Logo <span class="hint">PNG or JPG, up to 300 KB</span></span>
          <div style="display:flex;align-items:center;gap:12px;margin-top:5px"><div id="logo-prev" style="width:120px;height:56px;border:1px dashed var(--line-2);border-radius:6px;display:grid;place-items:center;background:#fafaf8">${s.logo ? `<img src="${esc(s.logo)}" style="max-width:110px;max-height:48px">` : '<span class="muted small">No logo</span>'}</div>
          <label class="btn sm">Upload<input type="file" accept="image/png,image/jpeg,image/webp" id="logo" hidden></label>${s.logo ? '<button type="button" class="btn sm ghost" data-act="logo-clear">Remove</button>' : ''}</div></div>
      </div></div>
      <div class="card"><div class="card-head"><h2>Tax &amp; currency</h2></div><div class="card-body grid4">
        <label class="f">Currency code<input name="currency" value="${v('currency')}" maxlength="3" style="text-transform:uppercase"></label>
        <label class="f">Tax name<input name="taxLabel" value="${v('taxLabel')}"></label>
        <label class="f">Default tax rate %<input name="taxRate" type="number" step="0.01" min="0" value="${v('taxRate')}"></label>
      </div></div>
      <div class="card"><div class="card-head"><h2>Numbering &amp; terms</h2></div><div class="card-body grid4">
        <label class="f">Invoice prefix<input name="invoicePrefix" value="${v('invoicePrefix')}"></label>
        <label class="f">Payment terms (days)<input name="dueDays" type="number" min="0" value="${v('dueDays')}"></label>
        <label class="f">Quotation prefix<input name="quotePrefix" value="${v('quotePrefix')}"></label>
        <label class="f">Quotes valid for (days)<input name="validDays" type="number" min="0" value="${v('validDays')}"></label>
      </div></div>
      <div class="card"><div class="card-head"><h2>Defaults on new documents</h2></div><div class="card-body grid2">
        <label class="f">Notes<textarea name="notes" rows="3">${v('notes')}</textarea></label>
        <label class="f">Terms &amp; conditions<textarea name="terms" rows="3">${v('terms')}</textarea></label>
        <label class="f span2">Payment details <span class="hint">Bank name, account number, SWIFT. Printed on invoices and statements.</span><textarea name="bank" rows="3">${v('bank')}</textarea></label>
      </div></div>
      <div class="card"><div class="card-head"><h2>Data</h2></div><div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span class="muted">${db.customers.length} customers, ${db.docs.length} documents stored.</span><button type="button" class="btn" data-act="backup">${ICON.down}Download backup (JSON)</button></div></div>
    </form>`;
  let logo = s.logo;
  $('#logo').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 300 * 1024) return toast('That logo is over 300 KB. Export a smaller PNG or JPG.');
    const r = new FileReader();
    r.onload = () => { logo = r.result; $('#logo-prev').innerHTML = `<img src="${esc(logo)}" style="max-width:110px;max-height:48px">`; dirty = true; };
    r.readAsDataURL(f);
  };
  $('#settings').oninput = () => (dirty = true);
  vSettings.logo = () => logo;
  vSettings.clearLogo = () => { logo = ''; $('#logo-prev').innerHTML = '<span class="muted small">No logo</span>'; dirty = true; };
}
async function saveSettings(patch) {
  let rec;
  if (patch) rec = { ...db.settings, ...patch };
  else {
    const f = Object.fromEntries(new FormData($('#settings')));
    f.currency = f.currency.trim().toUpperCase();
    if (!f.name.trim()) return toast('Enter your business name.');
    try { new Intl.NumberFormat('en', { style: 'currency', currency: f.currency }); } catch { return toast(`“${f.currency}” isn’t a currency code. Use ISO codes like MVR, USD or EUR.`); }
    for (const k of ['taxRate', 'dueDays', 'validDays']) f[k] = Math.max(0, +f[k] || 0);
    rec = { ...db.settings, ...f, logo: vSettings.logo() };
  }
  if (!await persist('settings', { ...rec, id: 'main' })) return;
  db.settings = rec; dirty = false;
  paintBrand(); toast('Settings saved'); route();
}

function notFound() { main().innerHTML = empty('Not found', 'This record may have been deleted.', '<a class="btn" href="#/">Back to overview</a>'); }

/* ---------- routing and events ---------- */
function paintBrand() {
  const s = S();
  $('#biz-name').textContent = s.name;
  $('#biz-mark').innerHTML = s.logo ? `<img src="${esc(s.logo)}" alt="">` : esc((s.name.match(/\b\w/g) || ['B']).slice(0, 2).join('').toUpperCase());
  document.title = `${s.name} · Billing`;
}
function route() {
  const [view = '', a = '', b = ''] = location.hash.replace(/^#\/?/, '').split('/');
  const navKey = view === 'doc' || view === 'edit' || view === 'new' ? `doc-${(db.docs.find(d => d.id === a) || { type: a }).type}` : view;
  $$('#nav a').forEach(el => el.classList.toggle('on', el.dataset.nav.split(' ').includes(navKey)));
  main().oninput = main().onkeydown = null;
  const views = {
    '': vOverview, invoices: () => vList('invoice', a), quotes: () => vList('quote', a),
    new: () => ['invoice', 'quote'].includes(a) ? vEdit(null, a, b) : notFound(), edit: () => vEdit(a), doc: () => vDoc(a),
    customers: () => vCustomers(a), customer: () => vCustomer(a, b), reports: vReports, report: () => vReport(a),
    templates: vTemplates, settings: vSettings,
  };
  (views[view] || notFound)();
  window.scrollTo(0, 0);
}

let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  if (dirty && !confirm('You have unsaved changes. Leave without saving?')) { history.replaceState(null, '', lastHash); return; }
  dirty = false; lastHash = location.hash; route();
});
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

document.addEventListener('click', async e => {
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a,button')) return (location.hash = row.dataset.href);
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (!e.target.closest('details.menu')) $$('details.menu[open]').forEach(m => m.open = false);
    return;
  }
  el.closest('details.menu')?.removeAttribute('open');
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'save-doc') return saveDoc();
  if (act === 'add-item') return vEdit.addItem();
  if (act === 'del-item') return vEdit.delItem(+el.closest('tr').dataset.i);
  if (act === 'new-customer') return customerDialog({}, c => (location.hash = `#/customer/${c.id}`));
  if (act === 'edit-customer') return customerDialog(vCustomer.current, () => route());
  if (act === 'delete-customer') {
    const c = vCustomer.current;
    if (db.docs.some(d => d.customerId === c.id)) return modal('Can’t delete this customer', `<p style="margin:0">${esc(c.name)} has quotations or invoices on record. Delete those first, so your books stay complete.</p>`, { ok: 'OK' });
    if (!await confirmBox(`Delete ${esc(c.name)}?`, 'This removes the customer record permanently.')) return;
    if (!await destroy('customer', c.id)) return;
    db.customers = db.customers.filter(x => x.id !== c.id);
    toast('Customer deleted'); return (location.hash = '#/customers');
  }
  if (act.startsWith('csv-') || act === 'print-report') return reportAction(act);
  if (act === 'tpl-type') { tplType = v; return vTemplates(); }
  if (act === 'tpl-default') return saveSettings({ [tplType === 'quote' ? 'quoteTemplate' : 'invoiceTemplate']: v });
  if (act === 'tpl-preview') return printPaper(renderDoc(sampleDoc(tplType), v, SAMPLE_CUSTOMER), `${TEMPLATES[v]} ${docLabel(tplType)} sample`);
  if (act === 'save-settings') return saveSettings();
  if (act === 'logo-clear') return vSettings.clearLogo();
  if (act === 'backup') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
    a.download = `billing-backup-${today()}.json`; a.click(); return;
  }
  return docAction(act, v);
});

(async function boot() {
  try {
    const d = await api();
    db = { customers: d.customers || [], docs: d.docs || [], settings: d.settings || {} };
  } catch {
    main().innerHTML = empty('Can’t reach the server', 'Your data is safe. Check your connection and reload the page.', '<button class="btn" onclick="location.reload()">Reload</button>');
    return;
  }
  paintBrand();
  $('#side-foot').textContent = `${S().currency} · ${S().taxLabel} ${S().taxRate}%`;
  route();
})();
</script>
</body>
</html>
