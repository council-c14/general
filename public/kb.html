<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard test</title>
<style>
body{margin:0;padding:16px;font:16px system-ui,sans-serif}
label{display:block;margin:18px 0 4px;font-weight:600}
input,textarea{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px}
</style>
</head>
<body>
<!-- Temporary: finds which field setting stops Gboard's long-press language menu from closing. -->
<label>A. Plain box</label>
<input>
<label>B. Spellcheck off</label>
<input spellcheck="false">
<label>C. Autocorrect and auto-capitals off</label>
<input autocorrect="off" autocapitalize="off">
<label>D. Spellcheck, autocorrect and auto-capitals off</label>
<input spellcheck="false" autocorrect="off" autocapitalize="off">
<label>E. Multi-line box</label>
<textarea rows="1"></textarea>
<label>F. Exactly like Google's search box</label>
<textarea rows="1" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" role="combobox" aria-autocomplete="list" enterkeyhint="search" maxlength="2048"></textarea>
<div style="height:60vh"></div>
</body>
</html>
